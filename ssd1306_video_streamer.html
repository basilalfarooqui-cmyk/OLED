<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exact-Size Image to PDF Converter</title>
  <!-- pdf-lib for client-side custom page dimension PDF generation -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    :root {
      --bg: #0b0d13;
      --card: #131722;
      --border: #1f2638;
      --accent: #5855e7;
      --accent-hover: #4844d4;
      --text: #f1f5f9;
      --dim: #79859b;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 16px; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.25rem; font-weight: 700; }
    .subtitle { font-size: 0.78rem; color: var(--dim); margin-top: 2px; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    
    .drop-zone {
      border: 2px dashed #334155; border-radius: 10px; padding: 32px 16px;
      text-align: center; cursor: pointer; position: relative; transition: 0.2s;
      background: #0d1018;
    }
    .drop-zone:hover { border-color: var(--accent); }
    .drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .drop-zone h3 { font-size: 0.95rem; margin-top: 8px; }
    .drop-zone p { font-size: 0.75rem; color: var(--dim); margin-top: 4px; }

    .controls { display: flex; gap: 10px; flex-wrap: wrap; }
    .input-group { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 4px; }
    .input-group label { font-size: 0.72rem; color: var(--dim); font-weight: 600; }
    input[type="text"] {
      background: #090b10; border: 1px solid var(--border); color: var(--text);
      padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; outline: none;
    }

    .btn-row { display: flex; gap: 10px; }
    .btn {
      flex: 1; background: var(--accent); color: #fff; border: none;
      padding: 12px; border-radius: 8px; font-size: 0.88rem; font-weight: 600;
      cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { background: #262c3e; color: #64748b; cursor: not-allowed; }
    .btn-clear { flex: 0 0 auto; background: #1e2433; border: 1px solid var(--border); padding: 12px 18px; }
    .btn-clear:hover { background: var(--danger); border-color: var(--danger); }

    .image-list { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; padding-right: 4px; }
    .image-item {
      display: flex; align-items: center; justify-content: space-between;
      background: #0d1018; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; gap: 12px;
    }
    .item-left { display: flex; align-items: center; gap: 12px; overflow: hidden; }
    .badge {
      background: var(--accent); color: #fff; font-size: 0.72rem; font-weight: 700;
      min-width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    }
    .thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; border: 1px solid #262c3e; background: #000; }
    .meta { overflow: hidden; }
    .meta-name { font-size: 0.82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta-dim { font-size: 0.7rem; color: var(--dim); margin-top: 2px; }
    
    .item-actions { display: flex; gap: 6px; }
    .icon-btn {
      background: #1a2030; border: 1px solid var(--border); color: var(--text);
      width: 30px; height: 30px; border-radius: 6px; cursor: pointer; font-size: 0.8rem;
    }
    .icon-btn:hover { background: #2a344d; }
    .icon-btn.del:hover { background: var(--danger); border-color: var(--danger); }

    .status { font-size: 0.8rem; text-align: center; color: var(--success); min-height: 18px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>Image to PDF Converter</h1>
      <div class="subtitle">100% Native Image Dimensions • Sequential Order • Zero Compression Loss</div>
    </div>
  </header>

  <div class="card">
    <div class="drop-zone">
      <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFiles(event)">
      <div style="font-size: 1.8rem;">🖼️</div>
      <h3>Tap or Drop Images Here</h3>
      <p>Supports JPG, PNG, WebP — added in exact selection order</p>
    </div>

    <div class="controls">
      <div class="input-group">
        <label>Output PDF Filename</label>
        <input type="text" id="pdfName" value="document.pdf" placeholder="document.pdf">
      </div>
    </div>

    <div class="btn-row">
      <button class="btn" id="btnGenerate" disabled onclick="generatePDF()">📄 Convert & Download PDF</button>
      <button class="btn btn-clear" id="btnClear" disabled onclick="clearAll()">Clear All</button>
    </div>

    <div id="statusText" class="status"></div>
  </div>

  <div class="card" id="listCard" style="display: none;">
    <div style="display:flex; justify-content:space-between; font-size:0.78rem; color:var(--dim); font-weight:600;">
      <span>UPLOADED ORDER (PAGE SEQUENCE)</span>
      <span id="countLabel">0 images</span>
    </div>
    <div class="image-list" id="imageList"></div>
  </div>
</div>

<script>
  let imageItems = []; // Stores { file, name, dataUrl, width, height }

  async function handleFiles(event) {
    const files = Array.from(event.target.files);
    if (!files.length) return;

    const status = document.getElementById('statusText');
    status.style.color = "#38bdf8";
    status.innerText = "Reading images in order...";

    // Process sequentially to strictly preserve selection/upload order
    for (const file of files) {
      const info = await loadImageInfo(file);
      imageItems.push(info);
    }

    event.target.value = ""; // Allow re-selecting same files if needed
    status.innerText = "";
    renderList();
  }

  function loadImageInfo(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          resolve({
            file,
            name: file.name,
            dataUrl: e.target.result,
            width: img.naturalWidth,
            height: img.naturalHeight
          });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function renderList() {
    const listCard = document.getElementById('listCard');
    const list = document.getElementById('imageList');
    const btnGen = document.getElementById('btnGenerate');
    const btnClear = document.getElementById('btnClear');
    const countLabel = document.getElementById('countLabel');

    if (imageItems.length === 0) {
      listCard.style.display = 'none';
      btnGen.disabled = true;
      btnClear.disabled = true;
      return;
    }

    listCard.style.display = 'flex';
    btnGen.disabled = false;
    btnClear.disabled = false;
    countLabel.innerText = `${imageItems.length} ${imageItems.length === 1 ? 'page' : 'pages'}`;

    list.innerHTML = '';
    imageItems.forEach((item, index) => {
      const row = document.createElement('div');
      row.className = 'image-item';
      row.innerHTML = `
        <div class="item-left">
          <div class="badge">${index + 1}</div>
          <img class="thumb" src="${item.dataUrl}" alt="">
          <div class="meta">
            <div class="meta-name">${item.name}</div>
            <div class="meta-dim">Page Size: ${item.width} × ${item.height} pt</div>
          </div>
        </div>
        <div class="item-actions">
          <button class="icon-btn" title="Move Up" onclick="moveItem(${index}, -1)" ${index === 0 ? 'disabled' : ''}>↑</button>
          <button class="icon-btn" title="Move Down" onclick="moveItem(${index}, 1)" ${index === imageItems.length - 1 ? 'disabled' : ''}>↓</button>
          <button class="icon-btn del" title="Remove" onclick="removeItem(${index})">✕</button>
        </div>
      `;
      list.appendChild(row);
    });
  }

  function moveItem(index, dir) {
    const target = index + dir;
    if (target < 0 || target >= imageItems.length) return;
    const temp = imageItems[index];
    imageItems[index] = imageItems[target];
    imageItems[target] = temp;
    renderList();
  }

  function removeItem(index) {
    imageItems.splice(index, 1);
    renderList();
  }

  function clearAll() {
    imageItems = [];
    document.getElementById('statusText').innerText = "";
    renderList();
  }

  // Convert any image (WebP/PNG/BMP) to raw PNG or JPEG bytes for pdf-lib
  async function getEmbeddableBytes(item) {
    const type = item.file.type;
    if (type === 'image/jpeg' || type === 'image/jpg') {
      return { format: 'jpg', bytes: await item.file.arrayBuffer() };
    }
    if (type === 'image/png') {
      return { format: 'png', bytes: await item.file.arrayBuffer() };
    }
    // Fallback for WebP/GIF/HEIC: draw to canvas at full resolution and export as PNG
    const canvas = document.createElement('canvas');
    canvas.width = item.width;
    canvas.height = item.height;
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.src = item.dataUrl;
    await new Promise(r => img.onload = r);
    ctx.drawImage(img, 0, 0);
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    return { format: 'png', bytes: await blob.arrayBuffer() };
  }

  async function generatePDF() {
    if (!imageItems.length) return;

    const btn = document.getElementById('btnGenerate');
    const status = document.getElementById('statusText');
    btn.disabled = true;
    status.style.color = "#38bdf8";

    try {
      const { PDFDocument } = PDFLib;
      const pdfDoc = await PDFDocument.create();

      for (let i = 0; i < imageItems.length; i++) {
        const item = imageItems[i];
        status.innerText = `Embedding page ${i + 1} of ${imageItems.length}...`;

        const { format, bytes } = await getEmbeddableBytes(item);
        const embeddedImg = format === 'jpg'
          ? await pdfDoc.embedJpg(bytes)
          : await pdfDoc.embedPng(bytes);

        // Create page with the EXACT width and height of this specific image
        const page = pdfDoc.addPage([item.width, item.height]);

        // Draw image filling 100% of the page from (0,0)
        page.drawImage(embeddedImg, {
          x: 0,
          y: 0,
          width: item.width,
          height: item.height
        });
      }

      status.innerText = "Finalizing PDF file...";
      const pdfBytes = await pdfDoc.save();

      // Trigger browser download
      const blob = new Blob([pdfBytes], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      let filename = document.getElementById('pdfName').value.trim() || 'document.pdf';
      if (!filename.toLowerCase().endsWith('.pdf')) filename += '.pdf';

      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      status.style.color = "var(--success)";
      status.innerText = `Success! Downloaded ${filename} (${imageItems.length} pages).`;
    } catch (err) {
      console.error(err);
      status.style.color = "var(--danger)";
      status.innerText = "Error: " + err.message;
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
